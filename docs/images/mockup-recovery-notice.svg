<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="765" viewBox="0 0 1440 765" role="img" aria-labelledby="title desc">
<title id="title">Dismiss the older-browser-data notice</title><desc id="desc">Illustrative before-and-after view of the recovery notice and its Dismiss button. Dismissal remembers acknowledgement in this browser and leaves older data unchanged.</desc>
<defs><linearGradient id="nav"><stop stop-color="#054d78"/><stop offset="1" stop-color="#16b0f2"/></linearGradient></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1440" height="765" rx="0" fill="#f4f7fa" stroke="#f4f7fa"/>
<rect x="0" y="0" width="1440" height="62" rx="0" fill="url(#nav)" stroke="none"/>
<text x="32" y="41" font-size="27" fill="#fdd219" font-weight="700">The Docket</text>
<text x="360" y="39" font-size="19" fill="#fdd219" font-weight="600">Task Management</text>
<rect x="360" y="53" width="221" height="3" rx="0" fill="#fdd219" stroke="none"/>
<text x="604" y="39" font-size="19" fill="white" font-weight="600">Metrics</text>
<text x="729" y="39" font-size="19" fill="white" font-weight="600">Project Managers</text>
<text x="965" y="39" font-size="19" fill="white" font-weight="600">Past Reports</text>
<text x="1146" y="39" font-size="19" fill="white" font-weight="600">Chat</text>
<text x="1239" y="39" font-size="19" fill="white" font-weight="600">Settings</text>
<rect x="32" y="82" width="1376" height="40" rx="4" fill="#fff5d5" stroke="#eddfaa"/>
<text x="49" y="109" font-size="17" fill="#6e5720" font-weight="700">DOCUMENTATION MOCKUP  •  SYNTHETIC DATA  •  SIMPLIFIED LAYOUT</text>
<text x="40" y="170" font-size="30" fill="#223447" font-weight="700">Older browser data: acknowledge without deleting</text>
<text x="40" y="222" font-size="22" fill="#223447" font-weight="700">Before dismissal</text>
<rect x="40" y="245" width="1360" height="176" rx="8" fill="white" stroke="#dce4ec"/>
<text x="66" y="286" font-size="22" fill="#223447" font-weight="400">Older browser data has an unknown Jira site. It is preserved for recovery</text>
<text x="66" y="320" font-size="22" fill="#223447" font-weight="400">and has not been loaded into this site.</text>
<rect x="66" y="349" width="122" height="42" rx="5" fill="white" stroke="#ccd6e1"/>
<text x="80" y="377" font-size="18" fill="#263d52" font-weight="600">Dismiss</text>
<text x="222" y="377" font-size="19" fill="#526779" font-weight="400">Acknowledge this notice in the current browser.</text>
<text x="40" y="470" font-size="22" fill="#223447" font-weight="700">After dismissal</text>
<rect x="40" y="490" width="1360" height="144" rx="8" fill="white" stroke="#dce4ec"/>
<text x="66" y="531" font-size="26" fill="#223447" font-weight="700">Task Management</text>
<text x="66" y="572" font-size="22" fill="#223447" font-weight="400">The notice is hidden. Your current site and saved work remain available.</text>
<text x="66" y="606" font-size="20" fill="#526779" font-weight="400">Older records are still preserved; Dismiss does not import, reassign or erase them.</text>
<text x="40" y="680" font-size="23" fill="#185f89" font-weight="700">Do not clear browser storage to dismiss this notice.</text>
<text x="40" y="739" font-size="18" fill="#526779" font-weight="400">Acknowledgement survives reloads. If browser storage is blocked, dismissal lasts for the current session.</text>
</g>
</svg>
