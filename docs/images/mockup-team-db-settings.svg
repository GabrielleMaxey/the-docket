<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">Use team DB — setting states</title><desc id="desc">Three illustrative states of Settings Team data: off with Local saving, enabled without a database URL with the exact warning, and enabled and connected with Team actions available.</desc>
