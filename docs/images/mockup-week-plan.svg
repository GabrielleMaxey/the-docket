<rect x="40" y="274" width="1020" height="750" rx="0" fill="#fff" stroke="#d9dee5" stroke-width="1" />
<text x="60" y="312" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">Weekly Work Plan: Thu Oct 29 – Fri Oct 30, 2026</text>
<rect x="60" y="322" width="980" height="2" rx="0" fill="#0c93d9" stroke="none" stroke-width="1" />
<text x="60" y="348" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="start">Tasks are ordered by a suggested-order score where higher means do sooner. The “How the score works” section at</text>
<text x="60" y="366" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="start">the end of the plan explains it.</text>
<text x="60" y="390" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="start">Hours are suggested time to spend working on each task, not how long it should take to complete.</text>
<text x="60" y="414" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="start">Total available capacity: ~16 hours (2 days × 8h), minus ~15% buffer = ~13.5 hours planned.</text>
<line x1="60" y1="430" x2="1040" y2="430" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="458" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Thursday, October 29</text>
<rect x="60" y="470" width="980" height="28" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
<text x="70" y="489" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">#</text>
<text x="100" y="489" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Issue</text>
<text x="200" y="489" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Task</text>
<text x="590" y="489" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Suggested working time</text>
<text x="760" y="489" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Notes</text>
<rect x="60" y="498" width="980" height="34" rx="0" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
<text x="70" y="519" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">1</text>
<text x="100" y="519" font-size="12" fill="#1b1c1d" font-weight="700" text-anchor="start">DEMO-101</text>
<text x="200" y="519" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">[Billing - Automation] Build IAP workflow</text>
<text x="590" y="519" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">2h</text>
<text x="760" y="519" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Score 75. Blocked by DEMO-099: check it first.</text>
<rect x="60" y="532" width="980" height="34" rx="0" fill="#f9fafc" stroke="#e2e8f0" stroke-width="1" />
<text x="70" y="553" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">2</text>
<text x="100" y="553" font-size="12" fill="#1b1c1d" font-weight="700" text-anchor="start">DEMO-204</text>
<text x="200" y="553" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">[Voice - Reporting] Add per-tech prompt report</text>
<text x="590" y="553" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">2.5h</text>
<text x="760" y="553" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Score 65. Stale 49 days.</text>
<rect x="60" y="566" width="980" height="34" rx="0" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
<text x="70" y="587" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">3</text>
<text x="100" y="587" font-size="12" fill="#1b1c1d" font-weight="700" text-anchor="start">DEMO-117</text>
<text x="200" y="587" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">[Maint - Dumps] Extra commands for SIPE cores</text>
<text x="590" y="587" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">1h triage</text>
<text x="760" y="587" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Stale 139 days: keep, re-scope or close.</text>
<text x="60" y="626" font-size="12.5" fill="#1b1c1d" font-weight="700" text-anchor="start">Thursday total planned: ~5.5h</text>
<text x="60" y="662" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Key Risks</text>
<text x="60" y="686" font-size="12.5" fill="#1b1c1d" font-weight="400" text-anchor="start">DEMO-099 blocks DEMO-101. If it is still open, re-route that time to DEMO-204.</text>
<rect x="60" y="712" width="980" height="350" rx="6" fill="#f9fafc" stroke="#e2e8f0" stroke-width="1" />
<text x="74" y="731" font-size="13" fill="#1b1c1d" font-weight="700" text-anchor="start">▼  How the score works</text>
<text x="74" y="758" font-size="12.5" fill="#1b1c1d" font-weight="400" text-anchor="start">Each task gets a suggested-order score. Higher means do sooner. The factors add up:</text>
<rect x="74" y="770" width="952" height="28" rx="0" fill="#fff" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="789" font-size="12" fill="#1b1c1d" font-weight="700" text-anchor="start">Factor</text>
<text x="330" y="789" font-size="12" fill="#1b1c1d" font-weight="700" text-anchor="start">Points</text>
<rect x="74" y="798" width="952" height="32" rx="0" fill="#fff" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="818" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Jira priority</text>
<text x="330" y="818" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">Highest 50, High 40, Medium 30, Low 20, Lowest 10 (unset counts as 30)</text>
<rect x="74" y="830" width="952" height="32" rx="0" fill="#f9fafc" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="850" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Status</text>
<text x="330" y="850" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">20 for active work (In Progress, Analyzing, Ready for Verification); 5 for other open statuses</text>
<rect x="74" y="862" width="952" height="32" rx="0" fill="#fff" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="882" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Staleness (days since last update)</text>
<text x="330" y="882" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">25 at 30+ days, 20 at 15+, 15 at 7+, 10 at 3+, 5 under 3 (capped at 10 for non-active)</text>
<rect x="74" y="894" width="952" height="32" rx="0" fill="#f9fafc" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="914" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Due date</text>
<text x="330" y="914" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">+25 if due today or overdue; +15 if due within 3 business days</text>
<rect x="74" y="926" width="952" height="32" rx="0" fill="#fff" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="946" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Blockers</text>
<text x="330" y="946" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">+30 if it blocks another open issue; +20 if an open issue blocks it</text>
<rect x="74" y="958" width="952" height="32" rx="0" fill="#f9fafc" stroke="#d9dee5" stroke-width="1" />
<text x="86" y="978" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">Your priority (P1 to P20)</text>
<text x="330" y="978" font-size="11.5" fill="#1b1c1d" font-weight="400" text-anchor="start">Up to +30, highest for P1</text>
<text x="74" y="1014" font-size="12" fill="#1b1c1d" font-weight="400" text-anchor="start">The score is a relative ordering for this list, not a measure of effort or importance on its own.</text>
<text x="24" y="1068" font-size="12" fill="#7a8794" font-weight="400" text-anchor="start">Documentation mockup. Synthetic data; simplified layout.</text>
</g>
