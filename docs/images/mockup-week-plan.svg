<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
<title id="title">Help me plan my week: your issues in suggested order</title><desc id="desc">Illustrative week plan. Only issues assigned to the signed-in user are planned, ordered by a suggested-order score with reasons, with suggested working time and a score key.</desc>
<defs><linearGradient id="nav"><stop stop-color="#054d78"/><stop offset="1" stop-color="#16b0f2"/></linearGradient></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1440" height="930" fill="#f4f7fa"/>
<rect x="0" y="0" width="1440" height="62" fill="url(#nav)"/>
<text x="32" y="41" font-size="27" fill="#fdd219" font-weight="700">The Docket</text>
<text x="360" y="39" font-size="19" fill="#fdd219" font-weight="600">Task Management</text>
<rect x="360" y="53" width="221" height="3" fill="#fdd219"/>
<text x="604" y="39" font-size="19" fill="white" font-weight="600">Metrics</text>
<text x="729" y="39" font-size="19" fill="white" font-weight="600">Project Managers</text>
<text x="965" y="39" font-size="19" fill="white" font-weight="600">Past Reports</text>
<text x="1146" y="39" font-size="19" fill="white" font-weight="600">Chat</text>
<text x="1239" y="39" font-size="19" fill="white" font-weight="600">Settings</text>
<rect x="32" y="82" width="1376" height="40" rx="4" fill="#fff5d5" stroke="#eddfaa"/>
<text x="49" y="109" font-size="17" fill="#6e5720" font-weight="700">DOCUMENTATION MOCKUP  •  SYNTHETIC DATA  •  SIMPLIFIED LAYOUT</text>
<text x="40" y="170" font-size="30" fill="#223447" font-weight="700">Help me plan my week: your issues, in suggested order</text>
<rect x="40" y="195" width="1360" height="150" rx="8" fill="white" stroke="#dce4ec"/>
<text x="66" y="232" font-size="22" fill="#223447" font-weight="700">Plan inputs</text>
<text x="66" y="270" font-size="20" fill="#223447" font-weight="400">Approach: Balance across projects  ·  Hours available: 32  ·  Fixed commitments: Deployment Thursday</text>
<rect x="66" y="292" width="22" height="22" rx="3" fill="#16b0f2"/><path d="M71 303 l5 5 l10 -11" stroke="white" stroke-width="3" fill="none"/>
<text x="100" y="310" font-size="19" fill="#526779" font-weight="400">Include team priorities  (shown only when Use team DB is on)</text>
<rect x="1150" y="262" width="230" height="52" rx="6" fill="#16b0f2"/>
<text x="1176" y="296" font-size="19" fill="white" font-weight="700">Generate week plan</text>
<rect x="40" y="365" width="1360" height="530" rx="8" fill="white" stroke="#dce4ec"/>
<rect x="66" y="385" width="1308" height="64" rx="5" fill="#eaf6fd" stroke="#bfe0f3"/>
<text x="80" y="411" font-size="18" fill="#185f89" font-weight="400">Tasks are ordered by a suggested-order score (higher means do sooner). Hours shown are suggested working time,</text>
<text x="80" y="436" font-size="18" fill="#185f89" font-weight="400">not an estimate of how long a task takes. About 15% of your hours are left free for meetings and interruptions.</text>
<text x="66" y="490" font-size="22" fill="#223447" font-weight="700">Wednesday  ·  Suggested: 6h working time</text>
<rect x="66" y="500" width="1308" height="92" rx="6" fill="#f8fafc" stroke="#e1e8ef"/>
<text x="84" y="526" font-size="20" fill="#185f89" font-weight="700">ODI-1042</text>
<text x="200" y="526" font-size="20" fill="#223447" font-weight="600">Add retry to ingest job</text>
<text x="760" y="526" font-size="18" fill="#526779" font-weight="400">⚠️ Overdue · In Progress</text>
<text x="1230" y="526" font-size="19" fill="#223447" font-weight="700">Score 150</text>
<text x="84" y="560" font-size="16" fill="#526779" font-weight="400">Highest +50 · In Progress +20 · Stale 31 days +25 · Overdue +25 · Blocks another issue +30</text>
<rect x="66" y="608" width="1308" height="92" rx="6" fill="#f8fafc" stroke="#e1e8ef"/>
<text x="84" y="634" font-size="20" fill="#185f89" font-weight="700">ODI-1177</text>
<text x="200" y="634" font-size="20" fill="#223447" font-weight="600">Update onboarding runbook</text>
<text x="760" y="634" font-size="18" fill="#526779" font-weight="400">Due Fri · To Do</text>
<text x="1230" y="634" font-size="19" fill="#223447" font-weight="700">Score 95</text>
<text x="84" y="668" font-size="16" fill="#526779" font-weight="400">High +40 · Other open status +5 · Stale 9 days +10 · Due within 3 business days +15 · Manual priority 3 +25</text>
<rect x="66" y="716" width="1308" height="92" rx="6" fill="#f8fafc" stroke="#e1e8ef"/>
<text x="84" y="742" font-size="20" fill="#185f89" font-weight="700">ODI-0931</text>
<text x="200" y="742" font-size="20" fill="#223447" font-weight="600">Clean up old feature flags</text>
<text x="760" y="742" font-size="18" fill="#526779" font-weight="400">Stale 120 days</text>
<text x="1230" y="742" font-size="19" fill="#223447" font-weight="700">Triage ≤ 1h</text>
<text x="84" y="776" font-size="16" fill="#526779" font-weight="400">Keep, re-scope or close it. Not given a full work block.</text>
<text x="66" y="850" font-size="19" fill="#223447" font-weight="600">Key Risks: ODI-1042 is overdue and blocks ODI-1190 (schedule follow-up on it first).</text>
