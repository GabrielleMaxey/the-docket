<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>The Docket</title>
  <defs>
    <clipPath id="wipClip">
      <rect x="56" y="174" width="400" height="40" rx="20"/>
    </clipPath>
    <clipPath id="ic1c">
      <rect x="148" y="240" width="308" height="10" rx="5"/>
    </clipPath>
    <clipPath id="ic2c">
      <rect x="148" y="276" width="308" height="10" rx="5"/>
    </clipPath>
    <clipPath id="ic3c">
      <rect x="148" y="312" width="308" height="10" rx="5"/>
    </clipPath>
    <clipPath id="ic4c">
      <rect x="148" y="348" width="308" height="10" rx="5"/>
    </clipPath>
  </defs>

  <!-- Icon background — Lumen dark blue -->
  <rect width="512" height="512" rx="112" fill="#04537e"/>

  <!-- Card surface — Lumen primary blue -->
  <rect x="32" y="120" width="448" height="272" rx="20" fill="#0c93d9"/>

  <!-- Card title stubs — lighter tint -->
  <rect x="56" y="144" width="120" height="10" rx="5" fill="#2caee8"/>
  <rect x="56" y="160" width="72" height="8" rx="4" fill="#0a7db8"/>

  <!-- WipBar — segmented capacity bar -->
  <g clip-path="url(#wipClip)">
    <rect x="56" y="174" width="400" height="40" fill="#044d76"/>
    <!-- Seg 1: In Progress — green, 56/83px fill -->
    <rect x="56" y="174" width="56" height="40" fill="#4ade80"/>
    <!-- Seg 2: Ready for Verification — green, 28/42px fill -->
    <rect x="142" y="174" width="28" height="40" fill="#4ade80" opacity="0.8"/>
    <!-- Seg 3: Backlog — FULL red (over WIP limit) -->
    <rect x="187" y="174" width="208" height="40" fill="#f87171"/>
    <!-- Seg 4: Analyzing — Lumen yellow (amber), 21/28px fill -->
    <rect x="398" y="174" width="21" height="40" fill="#FDD219"/>
    <!-- Segment gaps -->
    <rect x="139" y="174" width="3" height="40" fill="#0c93d9"/>
    <rect x="184" y="174" width="3" height="40" fill="#0c93d9"/>
    <rect x="395" y="174" width="3" height="40" fill="#0c93d9"/>
    <rect x="426" y="174" width="3" height="40" fill="#0c93d9"/>
  </g>

  <!-- Row divider -->
  <rect x="56" y="228" width="400" height="1" fill="#0a7db8"/>

  <!-- IC Row 1 — medium green -->
  <rect x="56" y="241" width="60" height="8" rx="4" fill="#2caee8"/>
  <g clip-path="url(#ic1c)">
    <rect x="148" y="240" width="308" height="10" fill="#044d76"/>
    <rect x="148" y="240" width="123" height="10" fill="#4ade80" opacity="0.85"/>
  </g>

  <!-- IC Row 2 — near capacity, Lumen yellow -->
  <rect x="56" y="277" width="80" height="8" rx="4" fill="#2caee8"/>
  <g clip-path="url(#ic2c)">
    <rect x="148" y="276" width="308" height="10" fill="#044d76"/>
    <rect x="148" y="276" width="262" height="10" fill="#FDD219" opacity="0.9"/>
  </g>

  <!-- IC Row 3 — over capacity, red -->
  <rect x="56" y="313" width="68" height="8" rx="4" fill="#2caee8"/>
  <g clip-path="url(#ic3c)">
    <rect x="148" y="312" width="308" height="10" fill="#044d76"/>
    <rect x="148" y="312" width="308" height="10" fill="#f87171"/>
  </g>

  <!-- IC Row 4 — light load, green -->
  <rect x="56" y="349" width="52" height="8" rx="4" fill="#2caee8"/>
  <g clip-path="url(#ic4c)">
    <rect x="148" y="348" width="308" height="10" fill="#044d76"/>
    <rect x="148" y="348" width="77" height="10" fill="#4ade80" opacity="0.7"/>
  </g>
</svg>
